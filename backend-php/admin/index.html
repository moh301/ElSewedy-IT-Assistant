<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWE IT Assist — Requests Admin</title>
<style>
    :root {
        --brand: #a9002c;
        --brand-dark: #7e0020;
        --brand-light: #fdecef;
        --ink-900: #17233b;
        --ink-500: #5b6b82;
        --ink-300: #9aa7b9;
        --border: #e5e8eb;
        --surface: #ffffff;
        --surface-muted: #f5f7f9;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--surface-muted);
        color: var(--ink-900);
    }
    header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 18px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
    }
    header h1 { font-size: 17px; margin: 0; }
    header p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-500); }
    .key-row { display: flex; gap: 8px; align-items: center; }
    input[type="password"], input[type="text"] {
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        width: 220px;
    }
    button {
        padding: 9px 16px;
        border: none;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button.secondary { background: var(--surface); color: var(--ink-900); border: 1px solid var(--border); }
    main { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
    #status { font-size: 13px; color: var(--ink-500); margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,35,56,0.06); }
    th, td { text-align: left; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--surface-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink-500); }
    tr:last-child td { border-bottom: none; }
    .details-cell { max-width: 320px; white-space: pre-wrap; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
    .pill.new { background: var(--brand-light); color: var(--brand-dark); }
    .pill.in-progress { background: #fff4de; color: #8a5a00; }
    .pill.resolved { background: #e6f6ec; color: #16794a; }
    select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12.5px; }
    .empty { text-align: center; padding: 60px 20px; color: var(--ink-300); }
    .source-tag { font-size: 11px; color: var(--ink-300); text-transform: uppercase; letter-spacing: 0.4px; }
</style>
</head>
<body>

<header>
    <div>
        <h1>SWE IT Assist — Support Requests</h1>
        <p>All "Other / Custom Issue" submissions from the website (and, later, the chatbot) land here.</p>
    </div>
    <div class="key-row">
        <input type="password" id="apiKey" placeholder="Admin API key">
        <button id="loadBtn">Load requests</button>
        <button class="secondary" id="refreshBtn" style="display:none;">Refresh</button>
    </div>
</header>

<main>
    <div id="status">Enter the admin API key above to load requests.</div>
    <table id="table" style="display:none;">
        <thead>
            <tr>
                <th>Requester</th>
                <th>Category</th>
                <th>Details</th>
                <th>Source</th>
                <th>Submitted</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</main>

<script>
    const statusEl = document.getElementById("status");
    const table = document.getElementById("table");
    const tbody = document.getElementById("tbody");
    const apiKeyInput = document.getElementById("apiKey");
    const loadBtn = document.getElementById("loadBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    const STORAGE_KEY = "swe_it_admin_key";
    apiKeyInput.value = sessionStorage.getItem(STORAGE_KEY) || "";

    function fmtDate(iso) {
        try {
            return new Date(iso).toLocaleString();
        } catch {
            return iso;
        }
    }

    async function loadRequests() {
        const key = apiKeyInput.value.trim();
        if (!key) { statusEl.textContent = "Enter the admin API key first."; return; }
        sessionStorage.setItem(STORAGE_KEY, key);

        statusEl.textContent = "Loading…";
        try {
            const res = await fetch("../api/support-requests", { headers: { "x-api-key": key } });
            if (res.status === 401) {
                statusEl.textContent = "Invalid API key.";
                table.style.display = "none";
                return;
            }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const items = await res.json();
            render(items);
            refreshBtn.style.display = "";
        } catch (err) {
            statusEl.textContent = "Failed to load requests: " + err.message;
        }
    }

    function render(items) {
        if (!items.length) {
            table.style.display = "none";
            statusEl.textContent = "No requests yet.";
            return;
        }

        statusEl.textContent = `${items.length} request${items.length === 1 ? "" : "s"}`;
        table.style.display = "";
        tbody.innerHTML = "";

        items.forEach((item) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>
                    <div><strong>${escapeHTML(item.name)}</strong></div>
                    <div style="color:var(--ink-500);font-size:12px;">${escapeHTML(item.email)}</div>
                </td>
                <td>${escapeHTML(item.category)}</td>
                <td class="details-cell">${escapeHTML(item.details)}</td>
                <td><span class="source-tag">${escapeHTML(item.source)} · ${escapeHTML(item.language || "")}</span></td>
                <td>${fmtDate(item.submittedAt)}</td>
                <td>
                    <span class="pill ${item.status}">${item.status}</span><br>
                    <select data-id="${item.id}" style="margin-top:6px;">
                        <option value="new" ${item.status === "new" ? "selected" : ""}>New</option>
                        <option value="in-progress" ${item.status === "in-progress" ? "selected" : ""}>In progress</option>
                        <option value="resolved" ${item.status === "resolved" ? "selected" : ""}>Resolved</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });

        tbody.querySelectorAll("select").forEach((sel) => {
            sel.addEventListener("change", () => updateStatus(sel.getAttribute("data-id"), sel.value));
        });
    }

    async function updateStatus(id, status) {
        const key = apiKeyInput.value.trim();
        try {
            const res = await fetch(`../api/support-requests/${id}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json", "x-api-key": key },
                body: JSON.stringify({ status })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            loadRequests();
        } catch (err) {
            alert("Failed to update status: " + err.message);
        }
    }

    function escapeHTML(str) {
        return String(str || "").replace(/[&<>"']/g, (c) => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
    }

    loadBtn.addEventListener("click", loadRequests);
    refreshBtn.addEventListener("click", loadRequests);
    apiKeyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") loadRequests(); });

    if (apiKeyInput.value) loadRequests();
</script>

</body>
</html>
