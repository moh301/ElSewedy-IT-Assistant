<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking — SWE IT Assist</title>
    <link rel="stylesheet" href="css/style.css?v=20260828-13">
</head>
<body data-page="booking">

    <script src="js/auth.js"></script>

    <!-- ================= ANNOUNCEMENT MARQUEE ================= -->
    <div class="marquee-bar" role="status" aria-live="off">
        <div class="marquee-track">
            <span class="marquee-text" id="marqueeText"></span>
            <span class="marquee-text" aria-hidden="true"></span>
        </div>
    </div>

    <div class="bg-ambient"></div>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="brand">
            <a href="index.html" class="logo-link" aria-label="Go to home page">
                <img class="logo-img" src="assets/logo.gif" alt="Elsewedy Electric">
            </a>
            <div class="brand-divider"></div>
            <div class="brand-text">
                <span class="product-name">SWE IT Assist</span>
                <span class="product-tag" id="productTag">IT Self-Service Portal</span>
            </div>
        </div>

        <div class="header-search">
            <div class="header-search-box">
                <span class="header-search-icon" data-icon="search"></span>
                <input type="search" id="headerSearch" class="header-search-input" autocomplete="off">
            </div>
        </div>

        <div class="header-right">
            <div class="lang-switcher" id="langSwitcher"></div>
            <a class="back-link" href="index.html">
                <span class="back-arrow" data-icon="arrowLeft"></span>
                <span id="backLabel">Home</span>
            </a>
            <div class="user-menu">
                <span class="user-menu-name" data-auth-name></span>
                <button type="button" class="logout-btn" data-auth-logout aria-label="Log out" title="Log out">
                    <span data-icon="logout"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="container">

        <nav class="breadcrumbs fade-up">
            <a href="index.html" id="crumbHome">Home</a>
            <span class="sep">/</span>
            <span class="current" id="crumbCurrent">Booking</span>
        </nav>

        <section class="hero fade-up" style="margin-bottom:0;">
            <h1 id="pageTitle" style="font-size:36px;">Booking</h1>
            <p id="pageSubtitle">Loading…</p>
        </section>

        <!-- ================= BOOKING TILES ================= -->
        <section class="categories stagger" id="categoryGrid"></section>
        <p class="search-empty" id="searchEmpty" hidden></p>

    </main>

    <script src="js/i18n.js?v=20260828-9"></script>
    <script src="js/main.js?v=20260828-13"></script>
</body>
</html>
